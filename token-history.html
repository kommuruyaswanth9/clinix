<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClinixFlow · Token history</title><link rel="stylesheet" href="/styles.css"></head>
<body><main style="max-width:980px;margin:0 auto;padding:34px 20px"><a class="btn outline" href="/staff.html">← Back to Operations dashboard</a><div class="head" style="margin-top:22px"><div><div class="crumb">ClinixFlow / Token history</div><h1>Token history</h1><div class="sub">Enter an R-series or E-series token to retrieve its complete ClinixFlow record.</div></div></div><div class="card" style="max-width:760px"><form id="tokenForm" class="toolbar"><input id="token" required autocomplete="off" placeholder="Token number, e.g. R-001, E-002 or R-H002"><button class="btn">Find token details</button></form><p id="message" class="sub" style="padding:0 15px">Use the exact token number assigned at registration.</p><div id="results" class="search-result"></div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function vitals(p){const v=p.vitals||{};return `<div class="patient-report"><div><span>Gender</span><b>${esc(p.gender||'Not recorded')}</b></div><div><span>Phone</span><b>${esc(p.phone||'Not recorded')}</b></div><div><span>Temperature</span><b>${v.temperature??'Not recorded'}${v.temperature!==null&&v.temperature!==undefined?' °C':''}</b></div><div><span>Blood pressure</span><b>${v.bpSystolic??'Not recorded'}/${v.bpDiastolic??'Not recorded'} mmHg</b></div><div><span>Blood glucose</span><b>${v.bloodSugar??'Not recorded'}${v.bloodSugar!==null&&v.bloodSugar!==undefined?' mg/dL':''}</b></div></div>`}
function profile(p){const m=p.medicalProfile||{};return `<div class="medical-summary"><b>Medical profile</b><span>Known conditions: ${esc(m.conditions||'Not recorded')}</span><span>Allergies: ${esc(m.allergies||'Not recorded')}</span><span>Current medications: ${esc(m.medications||'Not recorded')}</span><span>Clinical notes: ${esc(m.clinicalNotes||'Not recorded')}</span></div>`}
function card(p){const events=(p.events||[]).map(e=>`<li><b>${esc(e.type)}</b> · ${new Date(e.at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</li>`).join('');return `<article class="card search-card"><h2>${esc(p.token)} · ${esc(p.name)}</h2><p class="sub">${esc(p.registrationId)} · ${esc(p.pathway==='routine'?'Routine OPD':'Emergency')} · ${esc(p.department)} · ${esc(p.status)}</p><p><b>Reported symptoms:</b> ${esc(p.symptoms||'Not recorded')}<br><b>Duration:</b> ${esc(p.duration||'Not recorded')}${p.cancellationReason?`<br><b>Cancellation reason:</b> ${esc(p.cancellationReason)}`:''}</p>${vitals(p)}${profile(p)}<div class="history-card"><b>Token status timeline</b><ul>${events||'<li>No recorded status events.</li>'}</ul></div>${!['Completed','Cancelled'].includes(p.status)?`<div class="actions"><button class="btn red" data-cancel="${esc(p.id)}" data-token="${esc(p.token)}">Cancel token</button></div>`:''}</article>`}
async function cancelToken(id,token){const reason=prompt(`Why is ${token} being cancelled? This reason will be saved in patient history.`);if(reason===null)return;const msg=document.querySelector('#message');if(reason.trim().length<3){msg.textContent='Enter a cancellation reason of at least 3 characters.';return}try{const r=await fetch('/api/patients/'+encodeURIComponent(id)+'/cancel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reason})}),x=await r.json();if(!r.ok)throw Error(x.error||'Cancel failed');msg.textContent=token+' was cancelled and retained in history.';document.querySelector('#results').innerHTML=''}catch(e){msg.textContent=e.message||'Token could not be cancelled.'}}
document.querySelector('#tokenForm').addEventListener('submit',async e=>{e.preventDefault();const token=document.querySelector('#token').value.trim().toUpperCase(),msg=document.querySelector('#message'),out=document.querySelector('#results');if(!/^[RE]-(?:H)?\d+$/i.test(token)){msg.textContent='Enter an R-series or E-series token, for example R-001 or R-H002.';out.innerHTML='';return}msg.textContent='Searching token…';out.innerHTML='';try{const r=await fetch('/api/token-history?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Search failed');msg.textContent=x.results.length?'Token record found.':'No record matches this token.';out.innerHTML=x.results.map(card).join('');document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelToken(b.dataset.cancel,b.dataset.token))}catch(err){msg.textContent=err.message||'Token History could not be loaded.'}});
</script></body></html>
