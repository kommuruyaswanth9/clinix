<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClinixFlow · Patient history</title><link rel="stylesheet" href="/styles.css"></head>
<body><main style="max-width:980px;margin:0 auto;padding:34px 20px"><a class="btn outline" href="/staff.html">← Back to Operations dashboard</a><div class="head" style="margin-top:22px"><div><div class="crumb">ClinixFlow / Patient history</div><h1>Patient history</h1><div class="sub">Enter a patient phone number to retrieve every recorded ClinixFlow visit for that number.</div></div></div><div class="card" style="max-width:760px"><form id="historyForm" class="toolbar"><input id="phone" required inputmode="numeric" minlength="7" autocomplete="tel" placeholder="Patient phone number, e.g. 9000000001"><button class="btn">Find patient details</button></form><p id="message" class="sub" style="padding:0 15px">Enter the phone number saved during patient registration.</p><div id="results" class="search-result"></div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function profile(p){const m=p.medicalProfile||{};return `<div class="medical-summary"><b>Medical profile</b><span>Known conditions: ${esc(m.conditions||'Not recorded')}</span><span>Allergies: ${esc(m.allergies||'Not recorded')}</span><span>Current medications: ${esc(m.medications||'Not recorded')}</span><span>Clinical notes: ${esc(m.clinicalNotes||'Not recorded')}</span></div>`}
function vitals(p){const v=p.vitals||{};return `<div class="patient-report"><div><span>Gender</span><b>${esc(p.gender||'Not recorded')}</b></div><div><span>Department</span><b>${esc(p.department||'Not recorded')}</b></div><div><span>Temperature</span><b>${v.temperature??'Not recorded'}${v.temperature!==null&&v.temperature!==undefined?' °C':''}</b></div><div><span>Blood pressure</span><b>${v.bpSystolic??'Not recorded'}/${v.bpDiastolic??'Not recorded'} mmHg</b></div><div><span>Blood glucose</span><b>${v.bloodSugar??'Not recorded'}${v.bloodSugar!==null&&v.bloodSugar!==undefined?' mg/dL':''}</b></div></div>`}
function card(p){const events=(p.events||[]).map(e=>`<li><b>${esc(e.type)}</b> · ${new Date(e.at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</li>`).join('');return `<article class="card search-card"><h2>${esc(p.name)}</h2><p class="sub">${esc(p.phone)} · ${esc(p.token)} · ${esc(p.registrationId)} · ${esc(p.status)}<br>Age: ${esc(p.age||'Not recorded')} · Gender: ${esc(p.gender||'Not recorded')} · Email: ${esc(p.email||'Not recorded')}</p><p><b>Reported symptoms:</b> ${esc(p.symptoms||'Not recorded')}<br><b>Duration:</b> ${esc(p.duration||'Not recorded')}${p.cancellationReason?`<br><b>Cancellation reason:</b> ${esc(p.cancellationReason)}`:''}</p>${vitals(p)}${profile(p)}<div class="history-card"><b>Status timeline</b><ul>${events||'<li>No recorded status events.</li>'}</ul></div></article>`}
document.querySelector('#historyForm').addEventListener('submit',async e=>{e.preventDefault();const phone=document.querySelector('#phone').value.trim(),digits=phone.replace(/\D/g,'');const msg=document.querySelector('#message'),out=document.querySelector('#results');if(digits.length<7){msg.textContent='Enter a valid patient phone number.';out.innerHTML='';return}msg.textContent='Searching patient records…';out.innerHTML='';try{const r=await fetch('/api/patient-history?phone='+encodeURIComponent(phone),{cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Search failed');msg.textContent=x.results.length?`${x.results.length} recorded visit${x.results.length===1?'':'s'} found.`:'No ClinixFlow records match this phone number.';out.innerHTML=x.results.map(card).join('')}catch(err){msg.textContent=err.message||'Patient History could not be loaded.'}});
</script></body></html>
