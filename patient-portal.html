<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClinixFlow · Patient portal</title><link rel="stylesheet" href="/styles.css"></head>
<body><main style="max-width:850px;margin:0 auto;padding:34px 20px"><div class="head"><div><div class="crumb">ClinixFlow / Patient portal</div><h1>Patient token tracker</h1><div class="sub">Enter your token to see your current position, estimated wait, and recorded status.</div></div><a class="btn outline" href="/staff.html">Staff view</a></div><div class="card"><form id="form" class="toolbar"><input id="token" required placeholder="Your token, e.g. R-001 or E-002"><button class="btn">Track token</button></form><p id="message" class="sub" style="padding:0 15px">Your care pathway and clinical treatment order are always decided by hospital staff.</p><div id="result" class="search-result"></div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function eta(p){if(p.etaMinutes===null||p.etaMinutes===undefined)return 'Not applicable for this pathway';const seconds=Math.max(0,Number(p.etaSeconds||p.etaMinutes*60));const m=Math.floor(seconds/60),s=seconds%60;return m?`~${m} min ${String(s).padStart(2,'0')} sec`:`~${s} sec`}
function card(p){const note=p.notifications?.[0];return `<article class="card search-card"><h2>${esc(p.token)}</h2><div class="patient-report"><div><span>Status</span><b>${esc(p.status)}</b></div><div><span>Pathway</span><b>${esc(p.pathway==='routine'?'Routine OPD':'Emergency')}</b></div><div><span>Position</span><b>${p.queuePosition||'—'}</b></div><div><span>Estimated wait</span><b>${eta(p)}</b></div></div>${note?`<div class="notification"><b>🔔 Queue update</b><span>${esc(note.reason||`Your estimated time changed to ${note.newEta} min.`)}</span></div>`:''}<p class="sub">ETA is an operational estimate and can change with consultation progress and recorded clinic delays.</p></article>`}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const token=document.querySelector('#token').value.trim().toUpperCase(),msg=document.querySelector('#message'),out=document.querySelector('#result');if(!/^[RE]-(?:H)?\d+$/i.test(token)){msg.textContent='Enter a valid token, for example R-001 or R-H002.';out.innerHTML='';return}msg.textContent='Checking your token…';try{const r=await fetch('/api/token-history?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Could not track token');msg.textContent=x.results.length?'Current token details:':'No record matches this token.';out.innerHTML=x.results.map(card).join('')}catch(err){msg.textContent=err.message||'Token tracker is unavailable.'}});
</script></body></html>
