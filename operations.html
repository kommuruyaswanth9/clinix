<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClinixFlow · Operations / Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body><main style="max-width:1180px;margin:0 auto;padding:34px 20px"><div class="head"><div><div class="crumb">ClinixFlow / Operations / Admin</div><h1>Operations / Admin view</h1><div class="sub">Monitor hospital flow, department queues, delays, and bottlenecks. This view does not make clinical decisions.</div></div><a class="btn outline" href="/staff.html">Staff view</a></div><div id="summary" class="grid stats"></div><div id="bottleneck"></div><div class="card table-card" style="margin-top:14px"><table><thead><tr><th>DEPARTMENT</th><th>WAITING</th><th>AVERAGE WAIT</th><th>RECORDED DELAY</th><th>STATUS</th></tr></thead><tbody id="departments"></tbody></table></div><div class="card" style="margin-top:14px"><h2>Overall hospital flow</h2><div id="flow" class="activity"></div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stat=(label,value,note,icon,red=false)=>`<div class="card stat ${red?'red':''}"><i>${icon}</i><label>${label}</label><strong>${value}</strong><small>${note}</small></div>`;
async function load(){const r=await fetch('/api/dashboard',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not load operations data');const o=d.operations;document.querySelector('#summary').innerHTML=stat('Routine patients',o.routineWaiting,'Waiting now','☷')+stat('Emergency cases',o.emergencyActive,'Separate pathway','✚',true)+stat('Waiting >30 min',o.waitingOver30,'Requires attention','⚠',o.waitingOver30>0)+stat('Completed consultations',o.completedRoutine,'Routine records','✓');const b=o.bottleneck;document.querySelector('#bottleneck').innerHTML=b?`<div class="bottleneck"><b>⚠️ Bottleneck watch · ${esc(b.name)}</b><span>Status: ${esc(b.status)} · ${b.affected} patient(s) affected · ${b.delay?`recorded delay +${b.delay} min`:'no recorded delay'}.</span><small>${esc(o.prediction||'Monitor queue growth and available staff.')}</small></div>`:'<div class="normal-status"><b>● Operations normal</b> No current bottleneck has been detected.</div>';document.querySelector('#departments').innerHTML=o.departments.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.waiting}</td><td>~${x.averageWait} min</td><td>${x.delay?`+${x.delay} min`:'Normal'}</td><td><span class="op-status ${x.status==='Normal'?'ok':'warn'}">${esc(x.status)}</span></td></tr>`).join('');document.querySelector('#flow').innerHTML=[['Routine OPD waiting',o.routineWaiting],['Emergency active',o.emergencyActive],['Routine completed',o.completedRoutine],['Current active operational delays',d.delays.length]].map(x=>`<div><span>•</span><span><b>${x[0]}</b></span><span>${x[1]}</span></div>`).join('')}
load().catch(e=>document.body.insertAdjacentHTML('beforeend',`<p class="sub">${esc(e.message)}</p>`));setInterval(load,20000);
</script></body></html>
