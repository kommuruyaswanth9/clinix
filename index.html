<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClinixFlow · Secure login</title><link rel="stylesheet" href="/styles.css"></head>
<body><main style="max-width:520px;margin:0 auto;padding:72px 20px"><div class="card"><div class="logo" style="margin:0 0 20px"><span class="logo-mark">✚</span><div>ClinixFlow<small>CARE FLOW PLATFORM</small></div></div><h1>Secure workspace login</h1><p class="sub">A one-time passcode will be sent to your email address. Each OTP is valid for 2 minutes.</p><form id="emailForm" class="form-grid"><div class="field span2"><label>Email address</label><input id="email" type="email" required placeholder="name@example.com"></div><div class="actions span2"><button class="btn">Send OTP</button></div></form><form id="otpForm" class="form-grid" hidden><div class="field span2"><label>6-digit OTP</label><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="Enter OTP"></div><div class="actions span2"><button class="btn">Verify and continue</button></div></form><p id="message" class="sub"></p><p class="sub">OTP delivery uses Brevo. Configure <code>BREVO_API_KEY</code> and <code>BREVO_SENDER_EMAIL</code> locally.</p></div></main><script>
const msg=document.querySelector('#message'),emailForm=document.querySelector('#emailForm'),otpForm=document.querySelector('#otpForm');let email='';emailForm.addEventListener('submit',async e=>{e.preventDefault();email=document.querySelector('#email').value.trim();msg.textContent='Sending OTP…';try{const r=await fetch('/api/auth/request-otp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})}),x=await r.json();if(!r.ok)throw Error(x.error||'OTP could not be sent');otpForm.hidden=false;msg.textContent='OTP sent. It expires in 2 minutes.'}catch(err){msg.textContent=err.message}});otpForm.addEventListener('submit',async e=>{e.preventDefault();const otp=document.querySelector('#otp').value.trim();try{const r=await fetch('/api/auth/verify-otp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,otp})}),x=await r.json();if(!r.ok)throw Error(x.error||'Verification failed');location.href='/staff.html'}catch(err){msg.textContent=err.message}})
</script></body></html>
